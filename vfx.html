<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VFX &amp; AFX Review — Herumon Tower</title>
<link rel="stylesheet" href="theme.css?v=4">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#12100d; --panel:#1a1611; --panel2:#221c14; --line:#3d3122; --line2:#5c462c;
  --gold:#cfa650; --gold-dim:#8a7038; --ink:#d8cfc0; --ink-dim:#8d8474;
  --ok:#5a9a52; --warn:#dd5646;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);margin:0;font-family:'Inter',system-ui,sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:0 14px 60px}

/* ---- control bar ---- */
.ctlbar{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding:8px 0;background:linear-gradient(var(--bg) 78%,transparent);}
.btn{font-family:'Cinzel',serif;font-size:11px;font-weight:600;letter-spacing:.04em;padding:5px 12px;
  border:1px solid var(--line2);background:var(--panel2);color:var(--gold);cursor:pointer;
  text-transform:uppercase;transition:all .14s;white-space:nowrap}
.btn:hover{border-color:var(--warn);color:var(--warn)}
.btn.on{border-color:var(--ok);color:var(--ok)}
.btn.ghost{color:var(--ink-dim);border-color:var(--line)}
.spacer{flex:1}
.tag{font-size:11px;color:var(--ink-dim);font-family:'Cinzel',serif;letter-spacing:.05em}
.tag b{color:var(--gold)}
input[type=range]{width:78px;accent-color:var(--gold)}
input.txt{background:#0d0b08;border:1px solid var(--line);color:var(--ink);padding:5px 8px;
  font-size:12px;font-family:inherit;outline:none}
input.txt:focus{border-color:var(--gold-dim)}

/* ---- stage ---- */
/* ---- battle stage: the game's own 1920x1080 composition, scaled to fit ---- */
.stagebox{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:1px solid var(--line);background:#0a0810}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;
  font-family:'Spectral',serif;overflow:hidden}
.bg{position:absolute;inset:0;pointer-events:none}
.bg.base{background:#0a0810}
.bg.plate{background:no-repeat center center;background-size:100% 100%;filter:brightness(1.0) saturate(1.02) contrast(1.0)}
.bg.veil{background:radial-gradient(64% 60% at 50% 44%, rgba(10,8,18,0), rgba(10,8,18,.28) 82%),
  linear-gradient(180deg, rgba(12,9,20,.26), rgba(10,8,16,.12) 45%, rgba(8,6,13,.55))}
.bg.rim{background:radial-gradient(42% 50% at 16% 55%, rgba(200,120,60,.12), transparent 72%),
  radial-gradient(42% 50% at 84% 55%, rgba(120,90,200,.14), transparent 72%)}
.bg.haze{top:auto;left:0;right:0;bottom:0;height:34%;
  background:linear-gradient(180deg, transparent, rgba(20,15,30,.32) 40%, rgba(9,7,14,.68))}
.bg.vig{box-shadow:inset 0 0 300px 40px rgba(0,0,0,.5)}
#fx{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:6}
.side{position:absolute;inset:0;pointer-events:none;z-index:4}
.unit{position:absolute;isolation:isolate;transition:transform .16s ease-out}
.unit .shadow{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:230px;height:36px;
  background:radial-gradient(ellipse, rgba(220,120,50,.4), transparent 70%);filter:blur(6px)}
.unit.charslot .shadow{width:290px;background:radial-gradient(ellipse, rgba(185,152,90,.42), transparent 70%)}
 /* img.mon is the CREATURE SPRITE. The bank mounts its own <img> sheets inside the same
    tile, so every sprite rule here is scoped to .mon - an unscoped `.unit img` put
    object-fit:contain and a mirror transform on the sheets and broke the frame stepping. */
.unit img.mon{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  /* THE CLIENT BOTTOM-ALIGNS ITS SPRITE IN THE TILE (play/app.js, objectPosition/transformOrigin
     50% 88%). This page defaulted to 50% 50%, which lifted every creature ~17% of a tile higher
     than the game draws it - so a bank layer centred at top:54% sat ON the art here and floated
     above the art in the game. The review page must not flatter the composition it is reviewing. */
  object-position:50% 88%;transform-origin:50% 88%;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.65))}
.side.enemy .unit img.mon{transform:scaleX(-1)}
.unit .nm{position:absolute;top:100%;left:50%;transform:translate(-50%,-100%);margin-top:-4px;
  white-space:nowrap;font-family:'Cinzel',serif;font-weight:700;font-size:20px;letter-spacing:.16em;
  color:#e8e2d6;text-shadow:0 2px 6px #000,0 0 14px rgba(0,0,0,.9)}
.unit .badge{display:block;font-family:'Spectral',serif;font-weight:400;font-size:15px;
  letter-spacing:.06em;color:#a89c86;text-align:center;margin-top:3px}
.unit.lead .nm{color:var(--gold)}
.unit.cast{transform:translateY(-14px) scale(1.04)}
.unit.hit{animation:jolt .26s}
@keyframes jolt{0%{transform:translateX(0)}25%{transform:translateX(16px)}55%{transform:translateX(-11px)}100%{transform:translateX(0)}}
.hud{position:absolute;pointer-events:none;z-index:20}
.hud.floor{top:66px;left:28px;font-size:16px;letter-spacing:.13em;color:#a89c86}
.hud.round,.hud.streak{right:28px;text-align:center;padding:12px 26px;z-index:30;
  background:linear-gradient(180deg, rgba(16,12,22,.9), rgba(10,8,14,.85));border:1px solid #2b2434}
.hud.round{bottom:26px}
.hud.streak{top:40px}
.hud .lbl{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.22em;color:#8f8672}
.hud .val{font-family:'Cinzel',serif;font-weight:700;font-size:36px;line-height:1.05;color:#e8e2d6}
.hud.streak .val{color:#d8b264}

/* ---- now playing + review ---- */
.now{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);
  border-top:0;background:var(--panel);font-size:12px}
.now .mv{font-family:'Cinzel',serif;color:var(--gold);font-size:14px;letter-spacing:.03em}
.now .meta{color:var(--ink-dim)}
.now .chip{border:1px solid var(--line2);padding:2px 7px;font-size:10px;color:var(--ink-dim);
  text-transform:uppercase;letter-spacing:.05em}
/* An UNAUTHORED sound is not a neutral state and must not look like one - it is the whole point of
   the AFX run that a row without a composition is visible at a glance. */
.now .chip.unauth{border-color:var(--warn);color:var(--warn)}
.now .chip.comp{text-transform:none;letter-spacing:0;font-family:ui-monospace,Menlo,Consolas,monospace;
  color:var(--ink);max-width:46ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv-btn .t2 .unauth{color:var(--warn)}
.mv-btn .t2 .comp{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--gold-dim)}
.desc{padding:0 12px 10px;border:1px solid var(--line);border-top:0;background:var(--panel);
  color:var(--ink-dim);font-size:12px;font-style:italic;line-height:1.5}

.review{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;margin-bottom:16px;
  border:1px solid var(--line);border-top:0;background:var(--panel2)}
.review textarea{flex:1;min-width:240px;min-height:34px;max-height:120px;background:#0d0b08;
  border:1px solid var(--line);color:var(--ink);padding:7px 9px;font-family:inherit;font-size:12px;
  resize:vertical;outline:none}
.review textarea:focus{border-color:var(--gold-dim)}
.approve{font-family:'Cinzel',serif;font-size:12px;font-weight:700;letter-spacing:.06em;padding:8px 18px;
  border:1px solid var(--line2);background:var(--panel);color:var(--ink-dim);cursor:pointer;
  text-transform:uppercase;transition:all .14s}
.approve.on{background:#1c2c19;border-color:var(--ok);color:#8fce84}
.sync{font-size:10px;color:var(--ink-dim);font-family:'Cinzel',serif;letter-spacing:.05em;min-width:64px}
.sync.err{color:var(--warn)}

/* ---- grid ---- */
.gridhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px}
.gridhead h2{font-family:'Cinzel',serif;font-size:14px;letter-spacing:.12em;color:var(--gold);
  margin:0;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:6px}
.card{border:1px solid var(--line);background:var(--panel);padding:6px;cursor:pointer;text-align:center;
  position:relative;transition:border-color .12s,background .12s}
.card:hover{border-color:var(--gold-dim);background:var(--panel2)}
.card.sel{border-color:var(--gold);background:#241d13}
.card img{width:62px;height:62px;object-fit:contain;display:block;margin:0 auto}
.card .cn{font-family:'Cinzel',serif;font-size:11px;color:var(--ink);line-height:1.25;margin-top:3px;
  word-break:break-word}
.card .cs{font-size:9px;color:var(--ink-dim);letter-spacing:.05em}
.card .tick{position:absolute;top:3px;right:5px;color:var(--ok);font-size:13px;font-weight:700}
.card .part{position:absolute;top:3px;right:5px;color:var(--gold-dim);font-size:10px}

.moves{grid-column:1/-1;border:1px solid var(--gold-dim);background:#16130e;padding:8px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
.mv-btn{display:flex;gap:8px;align-items:flex-start;line-height:1.3;text-align:left;border:1px solid var(--line);
  background:var(--panel);padding:7px 9px;cursor:pointer;transition:all .12s}
.mv-btn:hover{border-color:var(--gold-dim);background:var(--panel2)}
.mv-btn.sel{border-color:var(--gold);background:#241d13}
.mv-btn .slot{font-family:'Cinzel',serif;color:var(--gold-dim);font-size:13px;min-width:14px}
.mv-btn .t1{display:block;font-family:'Cinzel',serif;font-size:12px;color:var(--ink)}
.mv-btn .t2{display:block;font-size:10px;color:var(--ink-dim);letter-spacing:.03em;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-btn .ok{margin-left:auto;color:var(--ok);font-size:13px}
.mv-btn .cm{margin-left:auto;color:var(--gold-dim);font-size:11px}
.hidden{display:none}
.loading{padding:40px;text-align:center;color:var(--ink-dim);font-family:'Cinzel',serif}
@media(max-width:760px){
  .stage{height:250px;padding:10px 12px 16px}
  .unit.lead img.mon{width:96px;height:96px}
  .unit.bench img.mon{width:52px;height:52px}
  .nm{max-width:80px;font-size:10px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(98px,1fr))}
}
</style>
</head>
<body>
<div class="topbar"><h1>VFX &amp; AFX Review</h1></div>
<div class="wrap">

  <div class="ctlbar">
    <button class="btn" id="reroll">⟳ Reroll teams</button>
    <button class="btn on" id="sound">♪ Sound on</button>
    <input type="range" id="vol" min="0" max="100" value="50" title="Volume">
    <button class="btn ghost" id="hd">HD art off</button>
    <span class="tag">Stage</span>
    <button class="btn stg on" data-st="0">Auto</button>
    <button class="btn stg" data-st="1">S1</button>
    <button class="btn stg" data-st="2">S2</button>
    <button class="btn stg" data-st="3">S3</button>
    <button class="btn" id="playAll">▶ Play all</button>
    <span class="spacer"></span>
    <span class="tag" id="progress">— / —</span>
    <button class="btn" id="copyBacklog">📋 Backlog (0)</button>
    <button class="btn" id="clearBacklog">✕ Clear</button>
    <button class="btn ghost" id="keyBtn" title="Review key — needed to save approvals">🔑 Key</button>
  </div>

  <div class="stagebox" id="stagebox">
   <div class="stage" id="stage">
    <div class="bg base"></div>
    <div class="bg plate" id="plate"></div>
    <div class="bg veil"></div>
    <div class="bg rim"></div>
    <div class="bg haze"></div>
    <div class="bg vig"></div>
    <div class="hud floor" id="floorName">FLOOR 1</div>
    <div class="hud streak"><div class="lbl">STREAK</div><div class="val" id="hudStreak">7</div></div>
    <div class="hud round"><div class="lbl">ROUND</div><div class="val" id="hudRound">1</div></div>
    <div class="side ally" id="ally"></div>
    <div class="side enemy" id="enemy"></div>
    <canvas id="fx" width="1920" height="1080"></canvas>
   </div>
  </div>

  <div class="now" id="now">
    <span class="mv" id="nowMove">Pick a creature below</span>
    <span class="meta" id="nowMeta"></span>
    <span class="spacer"></span>
    <span class="chip" id="chipArch">—</span>
    <span class="chip" id="chipAfx">—</span>

  <div class="review">
    <button class="approve" id="approveBtn" disabled>✓ Approve</button>
    <textarea id="comment" placeholder="Comment on this move's effect — saved to the backlog, copied with it." disabled></textarea>
    <span class="sync" id="sync"></span>
  </div>

  <div class="gridhead">
    <h2>Creatures</h2>
    <input class="txt" id="search" placeholder="filter by name, line or type" style="min-width:200px">
    <button class="btn ghost" id="onlyPending">Hide approved</button>
    <span class="tag" id="gridCount"></span>
  </div>
  <div class="grid" id="grid"><div class="loading">Loading codex…</div></div>

</div>

<link rel="stylesheet" href="assets/vfx/vfx_fx.css">
<script src="assets/vfx/vfx_fx.js"></script>
<script src="assets/vfx/afx.js"></script>
<!-- THE AFX BANK PLAYER, the client's (assets/vfx/afx_bank.js, lifted by tools/gen_vfx_fx.py the way
     vfx_fx.js is). afx.js above is now only the FALLBACK: a move with no AFX composition, or one the
     parser refuses, still gets the placeholder synth. codex/AFX_SPEC.md. -->
<script src="assets/vfx/afx_bank.js"></script>
<script>
/* ============================================================
   VFX & AFX review page.
   Data: codex/creatures.csv, codex/moves.csv, codex/move_vfx.csv
   Approvals: dfmc-vfx worker (server-side, cross-device).
   Backlog: localStorage, its own key, never touches approvals.
   ============================================================ */
const API   = 'https://dfmc-vfx.duiliovarella.workers.dev';
const BLKEY = 'dfmc_vfx_backlog';
const KKEY  = 'dfmc_vfx_key';
const IMG   = 'codex/thumbs/creatures/color/';
const MED   = 'codex/images/med/';      /* the cutouts the game's battle screen uses */
const CAST_MS = 2000;
/* THE PAGE'S SPEED FACTOR. One number, handed to BOTH renderers - VFX_BANK's ctx.speed and
   AFX_BANK.play's opts.speed - so the sound cannot drift from the picture it is scoring. The client
   moves this for its fast-forward; the review page reviews at 1x, because a reviewer judging a 900 ms
   composition at any other rate is judging something players never hear. */
const FX_SPEED = 1;

/* ---------- csv ---------- */
function parseCSV(text){
  const rows=[]; let f='',row=[],q=false;
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); f=''; rows.push(row); row=[]; }
    else f+=c;
  }
  if(f.length||row.length){ row.push(f); rows.push(row); }
  const head=rows.shift();
  return rows.filter(r=>r.length>1).map(r=>{const o={};head.forEach((h,i)=>o[h.trim()]=(r[i]||'').trim());return o;});
}
const bust=u=>u+'?t='+Date.now();

/* ---------- state ---------- */
let CRE=[], MOV=[], VFX={}, BY_LINE={}, MOVE_BY_ID={};
let approved=new Set(), pending=new Map(), flushT=null;
/* TWO RENDERERS, BOTH THE CLIENT'S (assets/vfx/vfx_fx.js, generated by tools/gen_vfx_fx.py).
   BANK draws the 48-sheet compositions in FX_S1/FX_S2/FX_S3; FX is the placeholder archetype
   path, which since 2026-09-17 is only the fallback for a move with no composition or one the
   parser refuses - exactly the order app.js uses. */
const FX=DFMC_VFX_FX.build(DFMC_VFX_FX.dom), FXHEX=DFMC_VFX_FX.HEX, FXDUR=DFMC_VFX_FX.DURMS;
const BANK=DFMC_VFX_FX.buildBank(DFMC_VFX_FX.dom);
let FXBANK={}, ULT=[], ALLROWS=[];
/* The 606-clip AFX bank, the event cues and the music beds, keyed the way AFX_BANK.load takes them. */
let AFXBANK={}, AFXEV=[], BGM=[];
/* WHAT WAS ACTUALLY PLAYED, for tools/afx_gate.py. A gate that only asks "did the page throw?" proves
   nothing about the sound (D 2026-09-17, on the VFX pass); this is the record it reads instead. */
const AFXLOG=[]; window.__afxLog=AFXLOG;
let selCre=null, selMove=null, teams={ally:[],enemy:[]}, turn=0, castT=null;
let stageSel=0, playT=null, playIx=-1;   /* stageSel 0 = follow the selected creature's stage */
let hd=false, onlyPending=false, filter='';

/* ---------- backlog (local, isolated) ---------- */
const Backlog={
  all(){ try{return JSON.parse(localStorage.getItem(BLKEY))||{};}catch{return{};} },
  get(id){ return this.all()[id]||null; },
  setComment(id,meta,text){
    const a=this.all();
    if(!text){ delete a[id]; } else { a[id]={...meta,comment:text,ts:Date.now()}; }
    localStorage.setItem(BLKEY,JSON.stringify(a)); paintBacklogBtn();
  },
  count(){ return Object.keys(this.all()).length; },
  clear(){ localStorage.removeItem(BLKEY); paintBacklogBtn(); render(); },
  text(){
    const a=this.all(), ids=Object.keys(a).sort();
    if(!ids.length) return 'VFX BACKLOG EMPTY — no comments pending.';
    let o='VFX / AFX BACKLOG ('+ids.length+' move'+(ids.length!==1?'s':'')+')\n'+'—'.repeat(46)+'\n';
    for(const id of ids){
      const e=a[id];
      o+=`${id}  ${e.creature} — ${e.move}\n`;
      o+=`  vfx ${e.archetype} / ${e.color} / ${e.anchor} / ${e.duration}   afx ${e.afx} ${e.pitch}`;
      o+=(e.layer?'   layer '+e.layer:'')+'\n';
      o+=`  ${e.comment}\n`;
    }
    return o.trim();
  }
};
function paintBacklogBtn(){ document.getElementById('copyBacklog').textContent='📋 Backlog ('+Backlog.count()+')'; }

/* ---------- approvals (server) ---------- */
function key(){ return localStorage.getItem(KKEY)||''; }
function setSync(t,err){ const s=document.getElementById('sync'); s.textContent=t; s.className='sync'+(err?' err':''); }

async function loadApprovals(){
  try{
    const r=await fetch(API+'/approvals',{cache:'no-store'});
    const j=await r.json();
    approved=new Set(Object.keys(j.approvals||{}));
    setSync('');
  }catch(e){ setSync('offline',true); }
  paintProgress();
}
function queueApproval(id,on){
  pending.set(id,on);
  clearTimeout(flushT); flushT=setTimeout(flushApprovals,700);
  setSync('saving…');
}
async function flushApprovals(){
  if(!pending.size) return;
  if(!key()){ setSync('no key',true); return; }
  const items=[...pending].map(([id,on])=>({id,on,by:'D'}));
  pending.clear();
  try{
    const r=await fetch(API+'/approve',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key()},
      body:JSON.stringify({items})});
    const j=await r.json();
    setSync(j.ok?'saved':(j.error||'failed'), !j.ok);
    if(!j.ok) items.forEach(i=>approved[i.on?'delete':'add'](i.id));
  }catch(e){ setSync('offline',true); }
  paintProgress(); render();
}
function paintProgress(){
  document.getElementById('progress').innerHTML='<b>'+approved.size+'</b> / '+MOV.length+' approved';
}

/* ---------- data ---------- */
async function boot(){
  /* One source of truth: the effect data now lives on the move row in moves.csv,
     keyed by Move_ID. move_vfx.csv is no longer read here. */
  const [c,m,mvx,fbk,abk,aev,bgm]=await Promise.all([
    fetch(bust('codex/creatures.csv')).then(r=>r.text()),
    fetch(bust('codex/moves.csv')).then(r=>r.text()),
    fetch(bust('codex/move_vfx.csv')).then(r=>r.text()),
    fetch(bust('codex/fx_bank.csv')).then(r=>r.text()),
    fetch(bust('codex/afx_bank.csv')).then(r=>r.text()),
    fetch(bust('codex/afx_events.csv')).then(r=>r.text()),
    fetch(bust('codex/bgm.csv')).then(r=>r.text())
  ]);
  /* THREE load() CALLS, ONE PER REGISTRY. The client's load() reads the KIND off the first row and
     REPLACES that registry wholesale, so handing it one mixed array registers the bank and silently
     drops the cues and the beds - the page would look fine and play no music at all. */
  parseCSV(abk).forEach(r=>{ if(r.Id) AFXBANK[r.Id]=r; });
  AFXEV=parseCSV(aev).filter(r=>r.Event_ID);
  BGM=parseCSV(bgm).filter(r=>r.Track_ID);
  DFMC_AFX_BANK.load(Object.values(AFXBANK),'','bank');
  DFMC_AFX_BANK.load(AFXEV,null,'events');
  DFMC_AFX_BANK.load(BGM,null,'bgm');
  CRE=parseCSV(c); MOV=parseCSV(m);
  MOV.forEach(r=>VFX[r.Move_ID]=r);
  /* The 48-sheet manifest, keyed by Id, exactly as the client hands it to VFX_BANK. */
  parseCSV(fbk).forEach(r=>{ if(r.Id) FXBANK[r.Id]=r; });
  /* move_vfx.csv is read for ONE thing: the 18 class ultimates. They are rows
     ULT-<LINE>-<stage> that have no moves.csv row (their stage IS the row, so only FX_S1 is
     authored and read). Every creature move still comes from moves.csv. */
  ULT=parseCSV(mvx).filter(r=>/^ULT-/.test(r.Move_ID));
  ULT.forEach(r=>{ VFX[r.Move_ID]=r; MOVE_BY_ID[r.Move_ID]=r; });
  const unresolved=MOV.filter(r=>!(r.VFX_Archetype||'').trim()).map(r=>r.Move_ID);
  if(unresolved.length) console.error('moves with no VFX archetype:',unresolved.length,unresolved.slice(0,5));
  MOV.forEach(r=>{ MOVE_BY_ID[r.Move_ID]=r; (BY_LINE[r.Line_ID]=BY_LINE[r.Line_ID]||[]).push(r); });
  ALLROWS=MOV.concat(ULT);
  preloadBank();
  Object.values(BY_LINE).forEach(a=>a.sort((x,y)=>(+x.Slot)-(+y.Slot)));
  await loadApprovals();
  rerollTeams(); render(); paintBacklogBtn(); sizeCanvas(); fitStage();
  requestAnimationFrame(frame);
}

/* ---------- teams ---------- */
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* the game's own slot geometry on its 1920x1080 stage (BATTLE scene) */
/* The client authors these as left:23% / right:-3% on a 1920x1080 stage. Resolved to pixel
   LEFT here on purpose: a negative percentage `right` did not lay out the far slot where the
   percentage says, and mixing the two edges is what put both characters on the same side. */
const SLOTS={
  ally :[{left:441.6,bottom:600,size:380},{left:441.6,bottom:110,size:380},{left:-57.6,bottom:300,size:480}],
  enemy:[{left:1098.4,bottom:600,size:380},{left:1098.4,bottom:110,size:380},{left:1497.6,bottom:300,size:480}]
};
function rerollTeams(){

                   st:1+Math.floor(Math.random()*3) });

function unitEl(cr,lead,side,i){

/* ---------- targeting ---------- */
function legalTargets(move,casterSide,casterIdx){
  const kinds=(move.Targets||'enemy').split('+').map(s=>s.trim()).filter(Boolean);
  const foe=casterSide==='ally'?'enemy':'ally', out=[];
  for(const k of kinds){
    if(k==='enemy') for(let i=0;i<teams[foe].length;i++) out.push([foe,i]);
    else if(k==='self') out.push([casterSide,casterIdx]);
    else if(k==='ally') for(let i=0;i<teams[casterSide].length;i++) if(i!==casterIdx) out.push([casterSide,i]);
  }
  return out.length?out:[[foe,0]];
}

/* ---------- the VFX bank ---------- */
/* The 48 sheets are warmed once so a cast never opens on an empty frame. */
function preloadBank(){ Object.keys(FXBANK).forEach(id=>{ const i=new Image(); i.src=FXBANK[id].File; }); }
/* One parse per composition TEXT, cached, exactly like app.js's bankParsed: a malformed text
   parses to null, is warned ONCE (a data signal, not a player-facing error) and the cast falls
   back to the archetype path. */
const _bankCache={};
function bankParsed(txt){
  if(!txt) return null;
  if(txt in _bankCache) return _bankCache[txt];
  let p=null;
  if(Object.keys(FXBANK).length){
    const r=BANK.parse(txt,FXBANK);
    if(r.errs.length){ try{ console.warn('[data] move_vfx.csv: malformed composition "'+txt+'": '+r.errs.join('; ')); }catch(e){} }
    else p=r;
  }
  return (_bankCache[txt]=p);
}
/* ULT rows carry one composition (FX_S1); a creature move is read at the stage asked for. */
function bankFor(mvId,stage){
  const vr=VFX[mvId]; if(!vr) return null;
  const isUlt=/^ULT-/.test(String(mvId)), st=isUlt?1:Math.max(1,Math.min(3,+stage||3));
  const p=bankParsed(vr['FX_S'+st]);
  return p?{parsed:p,stage:isUlt?4:st,isUlt:isUlt,row:vr}:null;
}
/* ---------- the AFX composition for one move at one stage ---------- */
/* Same shape as bankFor above, same fallback contract: null means "there is no usable composition",
   which is a FALLBACK to the placeholder synth, not an error. An unparseable one is warned about once
   per distinct text and then treated as absent - the verdicts are tools/afx_lint.py's. */
const _afxCache={};
function afxFor(mvId,stage){
  const vr=VFX[mvId]; if(!vr) return null;
  const isUlt=/^ULT-/.test(String(mvId)), st=isUlt?1:Math.max(1,Math.min(3,+stage||3));
  const txt=(vr['AFX_S'+st]||'').trim();
  if(!txt) return null;
  if(txt in _afxCache) return _afxCache[txt];
  let out=null;
  if(Object.keys(AFXBANK).length){
    const p=DFMC_AFX_BANK.parse(txt);   /* the client's parser, the same verdicts as tools/afx_lint.py */
    if(p.errs.length){ try{ console.warn('[data] move_vfx.csv: malformed AFX composition "'+txt+'": '+p.errs.join('; ')); }catch(e){} }
    else out={text:txt,parsed:p,stage:isUlt?4:st,isUlt:isUlt};
  }
  return (_afxCache[txt]=out);
}

/* !shake on the review stage. #stage carries fitStage's scale() inline, so the shake keyframes
   must restate it or the stage would snap to its unscaled 1920px for the duration. */
function bankShake(px,ms,at){
  const el=document.getElementById('stage'), box=document.getElementById('stagebox');
  if(!el||!el.animate) return;
  const sc=box.clientWidth/1920, N=6, k=[];
  for(let i=0;i<=N;i++){ const t=i/N, a=(i===0||i===N)?0:px*(1-t)*(i%2?1:-1);
    k.push({transform:'translate('+a.toFixed(2)+'px,'+(-a*0.4).toFixed(2)+'px) scale('+sc+')', offset:t}); }
  setTimeout(()=>{ try{ el.animate(k,{duration:ms,easing:'linear'}); }catch(e){} }, at||0);
}
function clearFxNow(){
  document.querySelectorAll('#ally .vxb,#enemy .vxb,#ally .fxwrap,#enemy .fxwrap').forEach(n=>n.remove());
  document.querySelectorAll('#ally .unit img.mon,#enemy .unit img.mon').forEach(i=>{ i.style.animation=''; });
}
/* ---------- the loop ---------- */
function stopLoop(){ clearTimeout(castT); castT=null; clearFxNow(); }
function curStage(){ return stageSel || Math.max(1,Math.min(3,+(selCre&&selCre.Stage)||3)); }
function startLoop(){ stopLoop(); turn=0; step(); }
function step(){
  const rc=cast();
  castT=setTimeout(step, Math.max(CAST_MS, rc&&rc.lenMs?rc.lenMs+320:0));
}
function cast(){
  if(!selMove) return null;
  const side=turn%2===0?'ally':'enemy'; turn++;
  return castNow(selMove, curStage(), side);
}
/* ONE CAST, in the client's order: the composition first, the archetype only when there is none.
   Returns a receipt so a gate can drive this directly and assert what mounted where. */
function castNow(mv, stage, side){
  if(!mv) return null;
  side=side||'ally';
  const v=VFX[mv.Move_ID]||{};
  const isUlt=/^ULT-/.test(mv.Move_ID), st=isUlt?1:Math.max(1,Math.min(3,+stage||3));
  const tg=pick(legalTargets(mv,side,0)), tside=tg[0], tidx=tg[1];
  const cEl=document.getElementById(side).children[0];
  const tEl=document.getElementById(tside).children[tidx];
  const dir=side==='ally'?1:-1;
  const b=bankFor(mv.Move_ID, st);
  const rc={id:mv.Move_ID, stage:isUlt?4:st, side:side, tside:tside, tidx:tidx, bank:!!b, flags:[], lenMs:0,
            wantUser:false, wantTgt:false, onUser:0, onTgt:0, back:0, arch:''};
  clearFxNow();
  if(b){
    const P=b.parsed, U=['u','ug','b'], T=['t','g','b'];
    const live=P.layers.filter(l=>FXBANK[l.id]);
    rc.flags=P.flags.slice();
    rc.lenMs=Math.round(BANK.lengthMs(P,FXBANK,false));
    rc.wantUser=live.some(l=>U.indexOf(l.anchor)>=0);
    rc.wantTgt =live.some(l=>T.indexOf(l.anchor)>=0);
    const tiles=[], made=[];
    if(cEl) tiles.push({el:cEl,isUser:true,isTarget:cEl===tEl});
    if(tEl&&tEl!==cEl) tiles.push({el:tEl,isUser:false,isTarget:true});
    tiles.forEach((t,ti)=>{
      /* the client's ctx, tile for tile: @g/@ug and z draw BEHIND the sprite, so that wrapper is
         inserted before the tile's first child - DOM order is the paint order here. */
      const ctx={isUser:t.isUser,isTarget:t.isTarget,dir:dir,stage:b.stage,
                 tileW:t.el.offsetWidth,lowVfx:false,speed:FX_SPEED,key:'vxb'+ti+'_'};
      const front=BANK.render(P,FXBANK,Object.assign({},ctx,{under:false}));
      const back =BANK.render(P,FXBANK,Object.assign({},ctx,{under:true}));
      if(front.length){ const w=document.createElement('div'); w.className='vxb';
        w.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:6';
        front.forEach(n=>w.appendChild(n)); t.el.appendChild(w); made.push(w); }
      if(back.length){ const w=document.createElement('div'); w.className='vxb';
        w.style.cssText='position:absolute;inset:0;pointer-events:none';
        back.forEach(n=>w.appendChild(n)); t.el.insertBefore(w,t.el.firstChild); made.push(w); }
      const n=front.length+back.length;
      if(t.isUser) rc.onUser+=n;
      if(t.isTarget) rc.onTgt+=n;
      rc.back+=back.length;
    });
    /* Take down THESE wrappers, by reference. A querySelector sweep here would let a cast that
       has already ended delete the layers of the cast that replaced it. */
    setTimeout(()=>made.forEach(w=>w.remove()), Math.max(rc.lenMs+320, CAST_MS));
    if(rc.flags.indexOf('!flash')>=0 && tEl){
      const im=tEl.querySelector('img.mon');
      if(im){ im.style.animation='none'; void im.offsetWidth;
              /* THE HIT TINT, picked by the CLIENT'S OWN picker (DFMC_VFX_FX.hitTintFor, lifted verbatim
         from play/app.js by tools/gen_vfx_fx.py). This line used to name vxbFlash, and when D's
         flash ruling deleted that keyframe the page went on naming it - a deleted keyframe animates
         nothing, so every !flash composition shot with no hit at all and the contact sheets could
         not show whether the ruling had landed. Never re-implement the pick here. */
      im.style.animation=DFMC_VFX_FX.hitTintFor(P, v.VFX_Color)+' 300ms ease-out '+
        Math.round(BANK.impactMs(P))+'ms 1 both'; }
    }
    if(rc.flags.indexOf('!shake')>=0) bankShake(b.isUlt?8:4, b.isUlt?250:150, Math.round(BANK.impactMs(P)));
  } else {
    /* THE FALLBACK, unchanged: sparse per-stage overrides, blank or absent inherits the base. */
    const ovr=(base,s2,s3)=>(st===3&&s3)||(st>=2&&s2)||base;
    const arch=ovr(v.VFX_Archetype,v.VFX_Archetype_S2,v.VFX_Archetype_S3);
    const host=(v.Target_Anchor==='self')?cEl:tEl;
    const dur=FXDUR[v.Duration_Class]||FXDUR.standard;
    const fn=FX[arch]||FX.generic_impact;
    rc.arch=arch||'generic_impact'; rc.lenMs=dur;
    if(host&&fn){
      const node=fn(FXHEX[v.VFX_Color]||FXHEX.bone, dur, dir);
      if(node){ const w=document.createElement('div'); w.className='fxwrap';
        w.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:7';
        w.appendChild(node); host.appendChild(w); setTimeout(()=>w.remove(),dur+120); }
    }
  }
  /* ---------- THE SOUND, in the same order as the picture: the composition first, the placeholder
     synth only when there is none. Both are driven off ONE speed factor with the VFX above, so what a
     reviewer hears lands where what they see lands. codex/AFX_SPEC.md § The player contract. ------- */
  const acomp=afxFor(mv.Move_ID, st);
  rc.afx=!!acomp; rc.afxLayers=0; rc.afxLenMs=0; rc.afxText=acomp?acomp.text:''; rc.aarch='';
  if(acomp){
    DFMC_AFX_BANK.play(acomp.parsed,{speed:FX_SPEED});
    rc.afxLayers=acomp.parsed.layers.length;
    rc.afxLenMs=Math.round(DFMC_AFX_BANK.lengthMs(acomp.parsed)/FX_SPEED);
    AFXLOG.push({id:mv.Move_ID,stage:rc.stage,text:acomp.text,layers:rc.afxLayers,lenMs:rc.afxLenMs,
                 speed:FX_SPEED,ids:acomp.parsed.layers.map(l=>l.id)});
    if(AFXLOG.length>4000) AFXLOG.splice(0,2000);
  } else {
    const aarch=((st===3&&v.AFX_Archetype_S3)||(st>=2&&v.AFX_Archetype_S2)||v.AFX_Archetype);
    rc.aarch=aarch||'';
    DFMC_AFX.play(aarch,v.AFX_Pitch,v.AFX_Layer,st);
  }
  if(cEl){ cEl.classList.add('cast'); setTimeout(()=>cEl.classList.remove('cast'),260); }
  if(tEl&&tEl!==cEl){ setTimeout(()=>{ tEl.classList.remove('hit'); void tEl.offsetWidth; tEl.classList.add('hit'); },
    rc.bank?Math.round(BANK.impactMs(b.parsed)):(FXDUR[v.Duration_Class]||600)*0.5); }
  return rc;
}
/* ---------- play all ---------- */
/* Walks every row - the 401 creature moves at the chosen stage, then the 18 ultimates - at the
   composition's own pace. The same entry point the bank gate drives. */
function playAll(on){
  clearTimeout(playT); playT=null;
  const btn=document.getElementById('playAll');
  if(on===false || (on===undefined && playIx>=0)){
    playIx=-1; btn.classList.remove('on'); btn.textContent='\u25b6 Play all'; clearFxNow(); return;
  }
  stopLoop(); playIx=0; btn.classList.add('on');
  const stepAll=()=>{
    if(playIx<0 || playIx>=ALLROWS.length){ playAll(false); return; }
    const row=ALLROWS[playIx], rc=castNow(row, curStage(), playIx%2===0?'ally':'enemy');
    btn.textContent='\u25a0 Stop ('+(playIx+1)+'/'+ALLROWS.length+')';
    document.getElementById('nowMove').textContent=(row.Name||row.Move_ID)+'  \u00b7  '+row.Move_ID;
    document.getElementById('nowMeta').textContent='  play all \u00b7 stage '+(rc?rc.stage:'?')+
      ' \u00b7 '+(rc&&rc.bank?'bank '+rc.lenMs+'ms':'archetype '+(rc?rc.arch:''));
    playIx++;
    playT=setTimeout(stepAll, Math.max(420, (rc&&rc.lenMs?rc.lenMs:600)+160));
  };
  stepAll();
}

/* ---------- selection ---------- */
function movesFor(cr){
  if(cr.ID==='CLASS') return [MOVE_BY_ID['M-CLASS-STRIKE']].filter(Boolean);
  return BY_LINE[cr.Line_ID]||[];
}
function moveName(mv,cr){
  if(cr.ID==='CLASS') return mv.Name;

}
function creatureDone(cr){
  const ms=movesFor(cr); if(!ms.length) return 0;

function selectMove(cr,mv){

/* What is ACTUALLY drawn for the current move at the current stage: the composition, or the
   archetype it fell back to. An empty or malformed FX_S<stage> is a fallback, not an error. */
function paintFxChip(){
  const c=document.getElementById('chipArch');
  if(!selMove){ c.textContent='—'; return; }
  const v=VFX[selMove.Move_ID]||{}, st=curStage(), b=bankFor(selMove.Move_ID,st);
  c.textContent=b ? ('S'+st+' bank · '+b.parsed.layers.length+' layer'+(b.parsed.layers.length!==1?'s':'')+
                     (b.parsed.flags.length?' · '+b.parsed.flags.join(' '):''))
                  : ('S'+st+' fallback · '+(v.VFX_Archetype||'—'));
  c.title=b ? (v['FX_S'+(/^ULT-/.test(selMove.Move_ID)?1:st)]||'') : 'no usable composition at this stage';
  paintAfxChip();
}
/* THE SOUND, beside the picture, in the same terms: the composition text itself, or the word
   UNAUTHORED in the warn colour. The old chip showed the placeholder taxonomy (`thud low`), which
   reads identically whether a composition exists or not - so it hid exactly the state this run is
   about. The taxonomy is still in the tooltip, because it is what the fallback synth is playing. */
function paintAfxChip(){
  const c=document.getElementById('chipAfx');
  if(!selMove){ c.textContent='—'; c.className='chip'; c.title=''; return; }
  const v=VFX[selMove.Move_ID]||{}, isUlt=/^ULT-/.test(selMove.Move_ID);
  const st=isUlt?1:curStage(), raw=(v['AFX_S'+st]||'').trim(), a=afxFor(selMove.Move_ID,st);
  const fb='fallback synth: '+(v.AFX_Archetype||'—')+' '+(v.AFX_Pitch||'')+(v.AFX_Layer?' + '+v.AFX_Layer:'');
  if(a){
    c.className='chip comp';
    c.textContent='AFX S'+st+' · '+a.parsed.layers.length+' layer'+(a.parsed.layers.length!==1?'s':'')+
      ' · '+Math.round(DFMC_AFX_BANK.lengthMs(a.parsed))+'ms · '+a.text;
    c.title=a.text;
  } else if(raw){
    c.className='chip unauth'; c.textContent='AFX S'+st+' malformed';
    c.title='"'+raw+'" - tools/afx_lint.py refuses it, so the page fell back. '+fb;
  } else {
    c.className='chip unauth'; c.textContent='AFX S'+st+' unauthored';
    c.title='No AFX_S'+st+' composition on this row. '+fb;
  }
}
function paintApprove(){

}
function buildPanel(cr){
  const panel=document.createElement('div'); panel.className='moves';
  for(const mv of movesFor(cr)){
    const v=VFX[mv.Move_ID]||{}, b=Backlog.get(mv.Move_ID);
    const btn=document.createElement('div');
    btn.className='mv-btn'+(selMove&&selMove.Move_ID===mv.Move_ID?' sel':'');
    /* The two compositions side by side, at the stage being reviewed: the picture's FX text and the
       sound's AFX text, with UNAUTHORED said out loud rather than shown as a dash. */
    const pst=/^ULT-/.test(mv.Move_ID)?1:curStage();
    const fxt=(v['FX_S'+pst]||'').trim(), aft=(v['AFX_S'+pst]||'').trim();
    const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    const afxBit=aft?('<span class="comp" title="'+esc(aft)+'">'+esc(aft)+'</span>')
                    :'<span class="unauth">unauthored</span>';
    btn.innerHTML='<span class="slot">'+mv.Slot+'</span><span style="flex:1"><span class="t1">'+moveName(mv,cr)+
      '</span><span class="t2">fx '+(fxt?'<span class="comp" title="'+esc(fxt)+'">'+esc(fxt)+'</span>'
                                       :'<span class="unauth">unauthored</span>')+
      ' \u00b7 afx '+afxBit+'</span></span>'+
      (approved.has(mv.Move_ID)?'<span class="ok">\u2713</span>':(b?'<span class="cm">\u270e</span>':''));
    btn.onclick=e=>{ e.stopPropagation(); selectMove(cr,mv); };
    panel.appendChild(btn);
  }
  return panel;
}
function render(){
  const host=document.getElementById('grid');
  const list=[{ID:'CLASS',Name:'Character',Stage:'\u2014',Line_ID:'CLASS',Type_Primary:'Class',Type_Secondary:''}]
    .concat(visibleCreatures());
  document.getElementById('gridCount').textContent=list.length+' shown';
  host.innerHTML='';
  const cards=list.map(buildCard);
  cards.forEach(c=>host.appendChild(c));
  if(selCre){
    const idx=list.findIndex(c=>c.ID===selCre.ID);
    if(idx>=0){
      const cols=gridCols(), at=Math.min(cards.length,(Math.floor(idx/cols)+1)*cols);
      host.insertBefore(buildPanel(selCre), cards[at]||null);
    }
  }
}
/* ---------- controls ---------- */
document.getElementById('reroll').onclick=()=>{ rerollTeams(); };
document.getElementById('sound').onclick=function(){
  /* BOTH players, or muting the page would silence the synth and leave the bank playing. */
  const on=!DFMC_AFX.isMuted(); DFMC_AFX.mute(on); DFMC_AFX_BANK.mute(on);
  this.textContent=on?'♪ Sound off':'♪ Sound on'; this.classList.toggle('on',!on);
  if(!on){ DFMC_AFX.unlock(); DFMC_AFX_BANK.unlock(); }
};
document.getElementById('vol').oninput=function(){
  DFMC_AFX.setVolume(this.value/100);
  DFMC_AFX_BANK.setMix({master:+this.value});
  DFMC_AFX.unlock(); DFMC_AFX_BANK.unlock();
};
document.getElementById('hd').onclick=function(){
  hd=!hd; this.textContent='HD art '+(hd?'on':'off'); this.classList.toggle('on',hd); paintStage();
};
document.querySelectorAll('.btn.stg').forEach(b=>{ b.onclick=function(){
  stageSel=+this.dataset.st;
  document.querySelectorAll('.btn.stg').forEach(o=>o.classList.toggle('on',o===this));
  paintFxChip(); render();   /* the move panel prints the composition AT THIS STAGE */
  if(playIx>=0){ playAll(false); playAll(true); } else if(selMove) startLoop();
}; });
document.getElementById('playAll').onclick=()=>playAll();
document.getElementById('approveBtn').onclick=toggleApprove;
document.getElementById('comment').oninput=function(){
  if(!selMove) return;
  const v=VFX[selMove.Move_ID]||{};
  Backlog.setComment(selMove.Move_ID,{creature:selCre.Name,move:moveName(selMove,selCre),
    archetype:v.VFX_Archetype,color:v.VFX_Color,anchor:v.Target_Anchor,duration:v.Duration_Class,
    afx:v.AFX_Archetype,pitch:v.AFX_Pitch,layer:v.VFX_Layer},this.value.trim());
};
document.getElementById('copyBacklog').onclick=async function(){
  const t=Backlog.text();
  try{ await navigator.clipboard.writeText(t); }
  catch{ const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta); }
  const o=this.textContent; this.textContent='✓ Copied'; setTimeout(()=>this.textContent=o,1400);
};
document.getElementById('clearBacklog').onclick=()=>{
  if(confirm('Clear the VFX backlog?\n\nApprovals are stored on the server and are NOT affected.')) Backlog.clear();
};
document.getElementById('keyBtn').onclick=function(){
  const cur=key();
  const k=prompt('Review key (needed to save approvals; stored on this device only):',cur);
  if(k===null) return;
  k.trim()?localStorage.setItem(KKEY,k.trim()):localStorage.removeItem(KKEY);
  paintKey(); flushApprovals();
};
function paintKey(){
  const b=document.getElementById('keyBtn');
  b.textContent=key()?'🔑 Key set':'🔑 Key';
  b.classList.toggle('on',!!key());
}
document.getElementById('search').oninput=function(){ filter=this.value; render(); };
document.getElementById('onlyPending').onclick=function(){
  onlyPending=!onlyPending; this.classList.toggle('on',onlyPending);
  this.textContent=onlyPending?'Showing pending':'Hide approved'; render();
};
addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.key==='a'||e.key==='A'){ toggleApprove(); e.preventDefault(); }
  if(e.key==='n'||e.key==='N'){ nextPending(); e.preventDefault(); }
});
function nextPending(){
  const order=[{ID:'CLASS',Name:'Character',Stage:'—',Line_ID:'CLASS',Type_Primary:'Class'}].concat(CRE);
  let start=selCre?order.findIndex(c=>c.ID===selCre.ID):0;
  for(let n=0;n<order.length;n++){
    const cr=order[(start+n)%order.length], ms=movesFor(cr);
    const mv=ms.find(m=>!approved.has(m.Move_ID) && !(selMove&&m.Move_ID===selMove.Move_ID));
    if(mv){ selectMove(cr,mv);
      const el=[...document.querySelectorAll('.card')].find(c=>c.querySelector('.cn').textContent===cr.Name);
      if(el) el.scrollIntoView({block:'center',behavior:'smooth'});
      return; }
  }
}
['click','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{
  DFMC_AFX.unlock(); DFMC_AFX_BANK.unlock();
},{once:true}));
paintKey();
boot();
</script>
