<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYPE CODEX</title>
<link rel="stylesheet" href="theme.css?v=4">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>

<div class="topbar">
<h1 id="topbar-title">TYPE CODEX</h1>
  <div style="width:90px;"></div>
</div>

<div id="status">LOADING...</div>
<main id="main" style="display:none;">
  <div class="type-hero">
    <h2 id="type-name"></h2>
    <p id="type-count"></p>
    <div id="type-glossary" style="max-width:640px;margin:10px auto 0;text-align:left;"></div>
  </div>

  <section>
    <h3>Creatures of This Type</h3>
    <div class="type-grid" id="type-grid"></div>
  </section>

  <section>
    <h3>Moves That Interact With This Type</h3>
    <div class="section-body" id="type-moves">
      <div class="pending-note">Loading…</div>
    </div>
  </section>
</main>

<script>
const CREATURES_URL = "codex/creatures.csv";

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i+1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') {}
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else { field += c; }
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  const header = rows.shift();
  return rows.filter(r => r.length > 1 || r[0]).map(r => {
    const obj = {};
    header.forEach((h, idx) => obj[h] = r[idx] ?? '');
    return obj;
  });
}
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function chromaKeyToDataURL(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2];
          const greenness = g - Math.max(r, b);
          if (g > 100 && greenness > 30) {
            const alpha = Math.max(0, 255 - greenness * 3.2);
            data[i+3] = Math.min(data[i+3], alpha);
          }
        }
        ctx.putImageData(imageData, 0, 0);
        resolve(canvas.toDataURL('image/png'));
      } catch (e) { resolve(url); }
    };
    img.onerror = () => resolve(url);
    img.src = url;
  });
}
async function applyChromaKeyAll() {
  const imgs = document.querySelectorAll('img.chroma[data-src]');
  await Promise.all(Array.from(imgs).map(async (img) => { img.src = await chromaKeyToDataURL(img.dataset.src); }));
}

async function load() {
  const params = new URLSearchParams(window.location.search);
  const type = params.get('type');
  if (!type) { document.getElementById('status').textContent = 'NO TYPE SPECIFIED'; return; }

  try {
    const text = await fetch(CREATURES_URL + '?t=' + Date.now()).then(r => r.text());
    const creatures = parseCSV(text);
    const matches = creatures.filter(c => c.Type_Primary === type || c.Type_Secondary === type || c.Type_Tertiary === type);

    document.title = type + ' — TYPE CODEX';
    document.getElementById('topbar-title').textContent = type.toUpperCase();
    document.getElementById('type-name').textContent = type;
    const medEl = document.createElement('img');
    medEl.className = 'type-med-hero';
    medEl.src = 'assets/types/' + encodeURIComponent(type) + '.png';
    medEl.alt = type;
    document.getElementById('type-name').parentNode.insertBefore(medEl, document.getElementById('type-name'));
    document.getElementById('type-count').textContent = matches.length + ' creature' + (matches.length === 1 ? '' : 's') + ' bear this type';

    try {
      const gloss = await fetch("codex/type_glossary.json?t=" + Date.now()).then(r => r.json());
      const g = gloss[type];
      if (g) document.getElementById('type-glossary').innerHTML =
        `<p style="color:#e8d9b8;font-size:14px;line-height:1.5;">${escapeHtml(g.definition)}</p>`
        + `<div style="font-size:11px;color:#8a7550;text-transform:uppercase;letter-spacing:1px;margin-top:6px;">Prompt motif</div>`
        + `<div style="color:#b9a988;font-size:13px;font-style:italic;line-height:1.5;">${escapeHtml(g.motifs)}</div>`;
    } catch (e) {}

    document.getElementById('type-grid').innerHTML = matches.length
      ? matches.map(c => `
          <a class="type-card" href="creature.html?id=${escapeHtml(c.ID)}">
            ${c.Image_Path ? `<img class="chroma" data-src="${escapeHtml(c.Image_Path)}" alt="">` : `<div class="no-img">NO IMAGE</div>`}
            <div class="tc-name">${escapeHtml(c.Name)}</div>
            <div class="tc-sub">Stage ${escapeHtml(c.Stage)} — ${escapeHtml(c.Rarity)}</div>
          </a>
        `).join('')
      : `<div class="pending-note">No creatures currently carry this type.</div>`;

    try {
      const mtext = await fetch("codex/moves.csv?t=" + Date.now()).then(r => r.text());
      const moves = parseCSV(mtext);
      const rx = new RegExp('\\b' + type.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b');
      const lineOf = {};
      creatures.forEach(c => { if (!lineOf[c.Line_ID] || +c.Stage < +lineOf[c.Line_ID].Stage) lineOf[c.Line_ID] = c; });
      const named = (m) => {
        const src = lineOf[m.Line_ID];
        const label = src ? src.Name : m.Line_ID;
        const href = src ? `creature.html?id=${escapeHtml(src.ID)}` : null;
        return href ? `<a href="${href}" style="color:var(--gold);text-decoration:none">${escapeHtml(label)}</a>` : escapeHtml(label);
      };
      const live = (v) => v && v.trim() && v.trim() !== '-';
      const against = moves.filter(m => live(m.Anti) && rx.test(m.Anti));
      const alongside = moves.filter(m => live(m.Synergy) && rx.test(m.Synergy));
      const block = (title, rows, field) => rows.length ? `
        <div style="margin-bottom:14px;">
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8a7550;margin-bottom:6px;">${title}</div>
          ${rows.map(m => `<div style="font-size:13px;color:#e8d9b8;line-height:1.6;">
              <strong>${escapeHtml(m.Name_S3 || m.Name)}</strong>
              <span style="color:#8a7550;"> — ${named(m)}</span><br>
              <span style="color:#b9a988;">${escapeHtml(m[field])}</span>
            </div>`).join('')}
        </div>` : '';
      const html = block(`Stronger against ${escapeHtml(type)}`, against, 'Anti')
                 + block(`Boosts ${escapeHtml(type)} allies`, alongside, 'Synergy');
      document.getElementById('type-moves').innerHTML = html
        || `<div class="pending-note">No move in the catalogue names this type in its synergy or anti clause.</div>`;
    } catch (e) {
      document.getElementById('type-moves').innerHTML =
        `<div class="pending-note">Move data could not be loaded.</div>`;
    }

    document.getElementById('status').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    applyChromaKeyAll();
  } catch (err) {
    document.getElementById('status').textContent = 'LOAD FAILED: ' + err.message;
  }
}
load();
</script>
<script src="admin.js"></script>
<script src="nav.js"></script>
</body>
</html>
